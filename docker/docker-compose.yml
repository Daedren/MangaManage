services:
  mangamanage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
      args:
        VITE_API_BASE_URL: /api
    container_name: mangamanage
    restart: unless-stopped
    volumes:
      # Mount settings.ini from host - changes take effect on container restart
      - ../settings.ini:/mbase/settings.ini:ro

      # Mount data directories (adjust these paths to match your host system)
      # Database location
      - ../data:/mbase/data

      # Manga folders - update the host paths to match your setup if needed
      - ../data/sources:/mbase/source:ro
      - ../data/archive:/mbase/archive
      - ../data/quarantine:/mbase/quarantine

      # Optional: Symlink folder (uncomment and set path if needed)
      # - /path/to/manga/symlinks:/mbase/symlinks

    # Optional: Set timezone
    environment:
      - TZ=UTC
    ports:
      - "8080:8080"

# Run CLI commands with the same image, for example:
# docker compose -f docker/docker-compose.yml run --rm mangamanage python .
# docker compose -f docker/docker-compose.yml run --rm mangamanage python . --checkMissingChapters
